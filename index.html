<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STWorkFlow - Task Manager</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f0f13',
                        cardBg: '#16161c',
                        innerBg: '#1e1e26',
                    }
                }
            }
        }
    </script>
    
    <!-- React & React DOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #0f0f13;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #16161c; }
        ::-webkit-scrollbar-thumb { background: #2a2a36; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Translation Dictionary
        const TRANSLATIONS = {
          th: {
            appTitle: "STWorkFlow",
            subTitle: "การจัดการเวลาและลำดับความสำคัญ",
            newTaskBtn: "+ สร้างงานใหม่",
            remainingTimeLabel: "เวลารวมงานคงเหลือวันนี้",
            progressLabel: "ความคืบหน้า",
            completedLabel: "เสร็จแล้ว",
            itemsLabel: "รายการ",
            hoursLabel: "ชั่วโมง",
            minutesLabel: "นาที",
            noTaskText: "ไม่มีงานในกลุ่มนี้",
            addInGroupText: "+ เพิ่มงาน",
            durationLabel: "ระยะเวลาที่คาดว่าจะใช้",
            outcomeLabel: "ผลลัพธ์ที่จะเกิด:",
            checklistLabel: "เช็คลิสต์ย่อย",
            editBtn: "แก้ไข",
            deleteBtn: "ลบ",
            modalCreateTitle: "สร้างภารกิจใหม่",
            modalEditTitle: "แก้ไขภารกิจ",
            taskTitleLabel: "ชื่อภารกิจ / งานที่ต้องทำ *",
            taskTitlePlaceholder: "เช่น เขียนสรุปรายงาน, ออกกำลังกาย...",
            priorityGroupLabel: "จัดอยู่ในกลุ่มความสำคัญ",
            outcomePlaceholder: "เช่น ปิดการขายได้, งานเสร็จทันเดดไลน์...",
            addSubtaskPlaceholder: "เพิ่มขั้นตอนย่อย...",
            addBtn: "เพิ่ม",
            cancelBtn: "ยกเลิก",
            saveBtn: "บันทึก",
            confirmDelete: "คุณต้องการลบงานนี้ใช่หรือไม่?",
            priorityHigh: "🔴 ด่วนและสำคัญมาก (High Priority)",
            priorityMedium: "🟡 สำคัญปานกลาง (Medium Priority)",
            priorityLow: "🟢 ทั่วไป / สำคัญน้อย (Low Priority)"
          },
          en: {
            appTitle: "STWorkFlow",
            subTitle: "Task Ranking & Time Duration",
            newTaskBtn: "+ New Task",
            remainingTimeLabel: "Total Remaining Time Today",
            progressLabel: "Progress",
            completedLabel: "Completed",
            itemsLabel: "tasks",
            hoursLabel: "hrs",
            minutesLabel: "mins",
            noTaskText: "No tasks in this group",
            addInGroupText: "+ Add Task",
            durationLabel: "Estimated Duration",
            outcomeLabel: "Expected Outcome:",
            checklistLabel: "Subtasks / Checklist",
            editBtn: "Edit",
            deleteBtn: "Delete",
            modalCreateTitle: "Create New Task",
            modalEditTitle: "Edit Task",
            taskTitleLabel: "Task Title *",
            taskTitlePlaceholder: "e.g., Prepare Presentation, Workout...",
            priorityGroupLabel: "Priority Group",
            outcomePlaceholder: "e.g., Close the deal, Stay healthy...",
            addSubtaskPlaceholder: "Add subtask...",
            addBtn: "Add",
            cancelBtn: "Cancel",
            saveBtn: "Save",
            confirmDelete: "Are you sure you want to delete this task?",
            priorityHigh: "🔴 High Priority",
            priorityMedium: "🟡 Medium Priority",
            priorityLow: "🟢 Low Priority"
          }
        };

        const INITIAL_TASKS = [
          {
            id: 't1',
            title: 'เคลียร์สไลด์นำเสนอโปรเจกต์ลูกค้า / Client Presentation',
            hours: 2,
            minutes: 30,
            priority: 'high',
            outcome: 'ลูกค้าประทับใจ และปิดการขายได้สำเร็จ / Close the deal successfully',
            completed: false,
            order: 0,
            checklist: [
              { id: 'c1', text: 'สรุปหัวข้อสำคัญ 5 ข้อ', done: true },
              { id: 'c2', text: 'ซ้อมพูดพรีเซนต์ 1 รอบ', done: false }
            ]
          }
        ];

        function App() {
          const [lang, setLang] = useState(() => localStorage.getItem('st_lang') || 'th');
          const t = TRANSLATIONS[lang];

          const [tasks, setTasks] = useState(() => {
            const saved = localStorage.getItem('st_workflow_v4_tasks');
            return saved ? JSON.parse(saved) : INITIAL_TASKS;
          });

          const [isModalOpen, setIsModalOpen] = useState(false);
          const [editingTask, setEditingTask] = useState(null);

          const [formData, setFormData] = useState({
            title: '',
            hours: 1,
            minutes: 0,
            priority: 'high',
            outcome: '',
            checklist: []
          });

          const [newChecklistText, setNewChecklistText] = useState('');

          useEffect(() => {
            localStorage.setItem('st_workflow_v4_tasks', JSON.stringify(tasks));
          }, [tasks]);

          useEffect(() => {
            localStorage.setItem('st_lang', lang);
          }, [lang]);

          const totalEstimatedTime = useMemo(() => {
            let totalMins = tasks
              .filter(t => !t.completed)
              .reduce((acc, task) => acc + (parseInt(task.hours || 0) * 60) + parseInt(task.minutes || 0), 0);
            
            return { hours: Math.floor(totalMins / 60), minutes: totalMins % 60 };
          }, [tasks]);

          const progressPercent = useMemo(() => {
            if (tasks.length === 0) return 0;
            const completed = tasks.filter(t => t.completed).length;
            return Math.round((completed / tasks.length) * 100);
          }, [tasks]);

          const moveTaskOrder = (taskId, direction) => {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const groupTasks = tasks
              .filter(t => t.priority === task.priority)
              .sort((a, b) => a.order - b.order);

            const currentIndex = groupTasks.findIndex(t => t.id === taskId);
            const targetIndex = direction === 'up' ? currentIndex - 1 : currentIndex + 1;

            if (targetIndex < 0 || targetIndex >= groupTasks.length) return;

            const targetTask = groupTasks[targetIndex];

            const updatedTasks = tasks.map(t => {
              if (t.id === task.id) return { ...t, order: targetTask.order };
              if (t.id === targetTask.id) return { ...t, order: task.order };
              return t;
            });

            setTasks(updatedTasks);
          };

          const toggleTaskComplete = (taskId) => {
            setTasks(tasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t));
          };

          const toggleSubtask = (taskId, subtaskId) => {
            setTasks(tasks.map(t => {
              if (t.id === taskId) {
                const newChecklist = t.checklist.map(c => c.id === subtaskId ? { ...c, done: !c.done } : c);
                return { ...t, checklist: newChecklist };
              }
              return t;
            }));
          };

          const handleOpenModal = (taskToEdit = null, defaultPriority = 'high') => {
            if (taskToEdit) {
              setEditingTask(taskToEdit);
              setFormData({ ...taskToEdit });
            } else {
              setEditingTask(null);
              setFormData({
                title: '',
                hours: 1,
                minutes: 0,
                priority: defaultPriority,
                outcome: '',
                checklist: []
              });
            }
            setIsModalOpen(true);
          };

          const handleAddChecklist = () => {
            if (!newChecklistText.trim()) return;
            setFormData({
              ...formData,
              checklist: [
                ...formData.checklist,
                { id: 'c_' + Date.now(), text: newChecklistText.trim(), done: false }
              ]
            });
            setNewChecklistText('');
          };

          const handleRemoveChecklist = (id) => {
            setFormData({
              ...formData,
              checklist: formData.checklist.filter(c => c.id !== id)
            });
          };

          const handleSaveTask = (e) => {
            e.preventDefault();
            if (!formData.title.trim()) return;

            if (editingTask) {
              setTasks(tasks.map(t => t.id === editingTask.id ? { ...formData, id: editingTask.id, completed: editingTask.completed, order: editingTask.order } : t));
            } else {
              const sameGroup = tasks.filter(t => t.priority === formData.priority);
              const maxOrder = sameGroup.length > 0 ? Math.max(...sameGroup.map(t => t.order || 0)) : -1;

              const newTask = {
                ...formData,
                id: 't_' + Date.now(),
                completed: false,
                order: maxOrder + 1
              };
              setTasks([...tasks, newTask]);
            }
            setIsModalOpen(false);
          };

          const handleDeleteTask = (taskId) => {
            if (confirm(t.confirmDelete)) {
              setTasks(tasks.filter(t => t.id !== taskId));
            }
          };

          const priorityGroups = [
            { id: 'high', title: t.priorityHigh, border: 'border-rose-500/40' },
            { id: 'medium', title: t.priorityMedium, border: 'border-amber-500/40' },
            { id: 'low', title: t.priorityLow, border: 'border-emerald-500/40' }
          ];

          return (
            <div className="min-h-screen pb-20">
              
              {/* Header */}
              <header className="sticky top-0 z-30 bg-[#16161c]/90 backdrop-blur-md border-b border-slate-800 px-4 py-3.5">
                <div className="max-w-4xl mx-auto flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center shadow-lg text-white font-bold text-lg">
                      ⏱
                    </div>
                    <div>
                      <h1 className="font-bold text-lg text-white">{t.appTitle}</h1>
                      <p className="text-[11px] text-rose-400 font-medium">{t.subTitle}</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    {/* Language Switcher */}
                    <button
                      onClick={() => setLang(lang === 'th' ? 'en' : 'th')}
                      className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 transition"
                    >
                      🌐 {lang === 'th' ? 'EN' : 'TH'}
                    </button>

                    <button
                      onClick={() => handleOpenModal(null, 'high')}
                      className="px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white font-medium text-xs rounded-xl shadow-lg transition"
                    >
                      {t.newTaskBtn}
                    </button>
                  </div>
                </div>
              </header>

              {/* Main Content */}
              <main className="max-w-4xl mx-auto px-4 pt-6 space-y-6">
                
                {/* Stats */}
                <div className="bg-[#16161c] border border-slate-800 rounded-2xl p-4 shadow-xl">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
                    <div className="flex items-center gap-3.5 bg-[#1a1a23] p-3.5 rounded-xl border border-slate-800">
                      <div className="p-2.5 rounded-xl bg-amber-500/10 text-amber-400 text-xl">
                        ⏳
                      </div>
                      <div>
                        <div className="text-xs text-slate-400">{t.remainingTimeLabel}</div>
                        <div className="text-base font-bold text-slate-100 font-mono">
                          {totalEstimatedTime.hours > 0 && `${totalEstimatedTime.hours} ${t.hoursLabel} `}
                          {totalEstimatedTime.minutes} {t.minutesLabel}
                        </div>
                      </div>
                    </div>

                    <div className="bg-[#1a1a23] p-3.5 rounded-xl border border-slate-800">
                      <div className="flex justify-between items-center text-xs mb-2">
                        <span className="text-slate-400">{t.progressLabel}</span>
                        <span className="text-rose-400 font-bold">{progressPercent}%</span>
                      </div>
                      <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                        <div 
                          className="bg-gradient-to-r from-rose-500 to-emerald-500 h-full transition-all duration-500"
                          style={{ width: `${progressPercent}%` }}
                        />
                      </div>
                      <div className="text-[11px] text-slate-500 mt-1.5 text-right">
                        {t.completedLabel} {tasks.filter(t => t.completed).length} / {tasks.length} {t.itemsLabel}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Priority Groups */}
                {priorityGroups.map(group => {
                  const groupTasks = tasks
                    .filter(t => t.priority === group.id)
                    .sort((a, b) => a.order - b.order);

                  return (
                    <div key={group.id} className="space-y-3">
                      <div className="flex items-center justify-between pt-2">
                        <h2 className="text-sm font-bold text-slate-200">
                          {group.title} ({groupTasks.length})
                        </h2>
                        <button
                          onClick={() => handleOpenModal(null, group.id)}
                          className="text-xs text-slate-400 hover:text-rose-400 flex items-center gap-1"
                        >
                          {t.addInGroupText}
                        </button>
                      </div>

                      {groupTasks.length === 0 && (
                        <div className="border border-dashed border-slate-800 rounded-xl p-4 text-center text-xs text-slate-500">
                          {t.noTaskText}
                        </div>
                      )}

                      <div className="space-y-3">
                        {groupTasks.map((task, index) => {
                          const isFirst = index === 0;
                          const isLast = index === groupTasks.length - 1;

                          return (
                            <div 
                              key={task.id}
                              className={`bg-[#16161c] border rounded-2xl p-4 ${
                                task.completed ? 'border-slate-800 opacity-50' : group.border
                              }`}
                            >
                              <div className="flex items-start gap-3">
                                
                                {/* Up / Down Order Buttons */}
                                <div className="flex flex-col items-center gap-1 pt-1 shrink-0">
                                  <button
                                    onClick={() => moveTaskOrder(task.id, 'up')}
                                    disabled={isFirst}
                                    className={`p-1.5 rounded bg-slate-800 text-xs ${isFirst ? 'opacity-20' : 'hover:bg-slate-700 text-white'}`}
                                  >
                                    ▲
                                  </button>
                                  <span className="text-[10px] font-mono text-slate-500">#{index + 1}</span>
                                  <button
                                    onClick={() => moveTaskOrder(task.id, 'down')}
                                    disabled={isLast}
                                    className={`p-1.5 rounded bg-slate-800 text-xs ${isLast ? 'opacity-20' : 'hover:bg-slate-700 text-white'}`}
                                  >
                                    ▼
                                  </button>
                                </div>

                                <div className="flex-1 min-w-0">
                                  <div className="flex items-center justify-between gap-2 mb-1.5">
                                    <div className="text-xs font-mono text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg">
                                      ⏱ {task.hours > 0 && `${task.hours} ${t.hoursLabel} `}{task.minutes} {t.minutesLabel}
                                    </div>
                                    <button onClick={() => toggleTaskComplete(task.id)} className="text-xl">
                                      {task.completed ? '✅' : '⚪'}
                                    </button>
                                  </div>

                                  <h3 className={`text-base font-semibold ${task.completed ? 'line-through text-slate-500' : 'text-slate-100'}`}>
                                    {task.title}
                                  </h3>

                                  {task.outcome && (
                                    <div className="mt-2.5 p-2.5 bg-rose-500/10 border border-rose-500/20 rounded-xl text-xs text-rose-300">
                                      🎯 <span className="font-semibold text-rose-400">{t.outcomeLabel}</span> {task.outcome}
                                    </div>
                                  )}

                                  {task.checklist && task.checklist.length > 0 && (
                                    <div className="mt-3 pt-2.5 border-t border-slate-800 space-y-1">
                                      <div className="text-[11px] text-slate-400 font-medium mb-1">{t.checklistLabel}</div>
                                      {task.checklist.map(item => (
                                        <div
                                          key={item.id}
                                          onClick={() => toggleSubtask(task.id, item.id)}
                                          className="flex items-center gap-2 text-xs text-slate-300 cursor-pointer py-1"
                                        >
                                          <span>{item.done ? '☑️' : '⏹️'}</span>
                                          <span className={item.done ? 'line-through text-slate-500' : ''}>{item.text}</span>
                                        </div>
                                      ))}
                                    </div>
                                  )}

                                  <div className="mt-3 pt-2 flex justify-end gap-3 text-xs border-t border-slate-800/60">
                                    <button onClick={() => handleOpenModal(task)} className="text-slate-400 hover:text-white">{t.editBtn}</button>
                                    <button onClick={() => handleDeleteTask(task.id)} className="text-rose-400">{t.deleteBtn}</button>
                                  </div>
                                </div>

                              </div>
                            </div>
                          );
                        })}
                      </div>

                    </div>
                  );
                })}

              </main>

              {/* Modal */}
              {isModalOpen && (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-[#16161c] border border-slate-800 w-full max-w-lg rounded-2xl p-5 space-y-4">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                      <h2 className="text-base font-bold text-slate-100">{editingTask ? t.modalEditTitle : t.modalCreateTitle}</h2>
                      <button onClick={() => setIsModalOpen(false)} className="text-slate-400">✕</button>
                    </div>

                    <form onSubmit={handleSaveTask} className="space-y-4">
                      <div>
                        <label className="block text-xs text-slate-300 mb-1">{t.taskTitleLabel}</label>
                        <input
                          type="text"
                          required
                          placeholder={t.taskTitlePlaceholder}
                          value={formData.title}
                          onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                          className="w-full bg-[#0d0d11] border border-slate-800 rounded-xl p-2.5 text-white text-sm"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-slate-300 mb-1">{t.hoursLabel}</label>
                          <input
                            type="number"
                            min="0"
                            value={formData.hours}
                            onChange={(e) => setFormData({ ...formData, hours: parseInt(e.target.value) || 0 })}
                            className="w-full bg-[#0d0d11] border border-slate-800 rounded-xl p-2 text-white text-sm"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-300 mb-1">{t.minutesLabel}</label>
                          <input
                            type="number"
                            min="0"
                            max="59"
                            value={formData.minutes}
                            onChange={(e) => setFormData({ ...formData, minutes: parseInt(e.target.value) || 0 })}
                            className="w-full bg-[#0d0d11] border border-slate-800 rounded-xl p-2 text-white text-sm"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs text-slate-300 mb-1">{t.priorityGroupLabel}</label>
                        <select
                          value={formData.priority}
                          onChange={(e) => setFormData({ ...formData, priority: e.target.value })}
                          className="w-full bg-[#0d0d11] border border-slate-800 rounded-xl p-2.5 text-white text-sm"
                        >
                          <option value="high">{t.priorityHigh}</option>
                          <option value="medium">{t.priorityMedium}</option>
                          <option value="low">{t.priorityLow}</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs text-slate-300 mb-1">{t.outcomeLabel}</label>
                        <textarea
                          rows={2}
                          placeholder={t.outcomePlaceholder}
                          value={formData.outcome}
                          onChange={(e) => setFormData({ ...formData, outcome: e.target.value })}
                          className="w-full bg-[#0d0d11] border border-slate-800 rounded-xl p-2.5 text-white text-sm"
                        />
                      </div>

                      <div>
                        <label className="block text-xs text-slate-300 mb-1">{t.checklistLabel}</label>
                        <div className="flex gap-2 mb-2">
                          <input
                            type="text"
                            placeholder={t.addSubtaskPlaceholder}
                            value={newChecklistText}
                            onChange={(e) => setNewChecklistText(e.target.value)}
                            className="flex-1 bg-[#0d0d11] border border-slate-800 rounded-xl px-3 py-1.5 text-white text-xs"
                          />
                          <button type="button" onClick={handleAddChecklist} className="px-3 py-1.5 bg-slate-800 text-xs rounded-xl">{t.addBtn}</button>
                        </div>
                        <div className="space-y-1">
                          {formData.checklist.map(item => (
                            <div key={item.id} className="flex justify-between p-1.5 bg-[#0d0d11] rounded text-xs text-slate-300">
                              <span>{item.text}</span>
                              <button type="button" onClick={() => handleRemoveChecklist(item.id)} className="text-rose-400">✕</button>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="flex justify-end gap-3 pt-3 border-t border-slate-800">
                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-slate-800 text-xs text-slate-300 rounded-xl">{t.cancelBtn}</button>
                        <button type="submit" className="px-5 py-2 bg-rose-600 text-xs text-white rounded-xl font-medium">{t.saveBtn}</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
